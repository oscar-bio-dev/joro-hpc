# ==============================================================================
# JORO-HPC — Configuración Maestra del MVP (Sección 6 y 13.2 de JORO-HPC.tex)
# Simulador Mecanístico LPDM-ABM para Trichonephila clavata
# Arquitectura Actualizada: Data Lake Permanente + Scratch NVMe + PostgreSQL (Port 5433)
# ==============================================================================

[project]
name = "JORO-HPC"
version = "0.1.0"
seed = 42819              # Semilla RNG principal para reproducibilidad
log_level = "INFO"

[storage]
# Infraestructura de almacenamiento HPC (Data Lake vs Scratch)
datalake_root = "/mnt/ecotech_datalake"
scratch_root = "/mnt/hpc_scratch/joro-hpc"

[domain]
# Dominio espacial del MVP: Este de Estados Unidos (Sección 6)
lon_min = -95.0
lon_max = -70.0
lat_min =  25.0
lat_max =  45.0
srid = 5070               # EPSG:5070 NAD83 / Conus Albers Equal Area
cell_size_m = 5000.0      # Malla demográfica 5 km x 5 km (~2.0 x 10^5 celdas)

[temporal]
# Ventana de simulación (Sección 12)
calib_start_year = 2014
calib_end_year   = 2019   # Calibración: 2014-2019 (6 años inclusivos)
eval_start_year  = 2020
eval_end_year    = 2024   # Evaluación fuera de muestra: 2020-2024 (5 años)

# Temporada de dispersión aérea juvenil (Sección 13.1)
ballooning_start_month = 5   # Mayo
ballooning_end_month   = 7   # Julio
ballooning_days        = 92  # Días por año para el LPDM

[atmosphere]
# Tensores ERA5 en NetCDF4 montados en scratch NVMe de alta velocidad
data_dir = "/mnt/hpc_scratch/joro-hpc/era5_nc_active"
time_step_s = 60.0        # dt para integración de Euler-Maruyama en LPDM [s]
era5_time_step_h = 1.0    # Resolución temporal de los archivos ERA5 [h]

# 12 niveles isobáricos seleccionados [hPa]
pressure_levels = [
    1000, 975, 950, 925, 900, 875, 850, 825, 800, 775, 750, 700
]

# Variables requeridas
variables_3d = ["u", "v", "w_omega", "t"]
variables_sfc = ["sp", "t2m", "u10", "v10", "blh"]

[lpdm]
# Parámetros físicos del LPDM (Sección 7)
max_particles_per_cell = 1000
boundary_condition_top = "open"      # "open" | "reflective" | "extended"
boundary_condition_bottom = "absorbing"
well_mixed_criterion = "thomson_1987"

[abm]
# Configuración del ABM demográfico (Sección 8)
time_step_days = 1.0      # Paso temporal del ABM [días]
simd_vector_width = 16    # 16 floats FP32 en registros AVX-512 (512 bits)
cohort_compression = true # Modo super-individuos / cohortes ponderadas

# Parámetros de capacidad de carga K_i (Sección 8.4)
k0 = 5000.0               # Capacidad de carga base
gamma1_imp = 0.45         # Impermeabilidad urbana
gamma2_borde = 0.65       # Densidad de borde de bosque
gamma3_dosel = 0.30       # Dosel arbóreo
k_min = 100.0
k_max = 50000.0

[database]
# Conexión a PostgreSQL / PostGIS (migrado a puerto 5433 para evitar colisiones Docker)
host = "localhost"
port = 5433
dbname = "joro_db"
user = "joro_admin"
password = "joro_db_password"
tablespace = "hpc_fast"
table_grid = "grid_5km"
table_observations = "cell_annual_observations"
table_raw_occurrences = "occurrences_raw"
