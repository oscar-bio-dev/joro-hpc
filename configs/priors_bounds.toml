# ==============================================================================
# JORO-HPC — Intervalos de Exploración y Pesos de Calibración
# Sincronizado estrictamente con Secciones 7.3, 8.3, 11 y 13.2 de JORO-HPC.tex
# NOTA: Los rangos definen cotas de búsqueda física, no distribuciones posteriores.
# ==============================================================================

[calibration]
# Pesos para la función de costo multicriterio J(theta)
# J(theta) = w1 * J_llegada + w2 * J_frente + w3 * J_persistencia
w_llegada      = 0.333333
w_frente       = 0.333333
w_persistencia = 0.333334

# Tolerancia de compatibilidad Delta para definir Theta_comp
delta_threshold = 0.05
max_evaluations = 5000
timeout_seconds = 300

[abm_priors]
# Fecundidad: número de huevos por saco (Tabla 8.3 de JORO-HPC.tex: 400–500 huevos/saco)
fecundity_min = 400.0
fecundity_max = 500.0
fecundity_default = 450.0

# Producción anual por hembra (considerando 1 a 3 sacos anuales en condiciones óptimas)
fecundity_annual_max = 1500.0

# Coeficiente Q10 de aceleración metabólica por estadio (Tabla 8.3: 2.0–3.0)
q10_min = 2.0
q10_max = 3.0
q10_default = 2.2

# Temperatura crítica de daño por frío T_c,s [°C] (Tabla 8.3: [-5.0, 0.0] °C)
t_c_min = -5.0
t_c_max =  0.0
t_c_default = -3.5
t_c_extreme_cold = -8.0  # Límite inferior para exploración de sensibilidad térmica extrema

# Tasa de daño por frío alpha_s [días^-1 °C^-beta] (Tabla 8.3: [0.01, 0.10])
alpha_damage_min = 0.01
alpha_damage_max = 0.10
alpha_damage_default = 0.04

# Exponente no lineal beta_s (modelos discretos: {1, 2, 3})
beta_damage_candidates = [1, 2, 3]
beta_damage_default = 2

# Viabilidad de ootecas q_viab (Tabla 8.3: [0.20, 0.90])
q_viab_min = 0.20
q_viab_max = 0.90
q_viab_default = 0.65

# Fracción de juveniles que inician baloneo q_balloon (Tabla 8.3: [0.10, 0.60])
q_balloon_min = 0.10
q_balloon_max = 0.60
q_balloon_default = 0.35

# Parámetro de dispersión de la distribución Binomial Negativa (kappa_B)
kappa_b_min = 0.5
kappa_b_max = 5.0
kappa_b_default = 1.8

[lpdm_priors]
# Parámetros de lanzamiento logístico: logit(P(L=1)) = eta0 + eta1*u10 + ...
eta0 = -3.5
eta1_u10 = 0.45       # Sensibilidad a la velocidad de viento en superficie [s/m]
eta2_sconv = 0.60     # Sensibilidad a la velocidad convectiva [s/m]
eta3_temp = 0.20      # Término térmico
eta4_fen = 1.00       # Ventana fenológica diurna

# Parámetros de sedimentación aerodinámica (Sección 7.3: M < 100 mg, L_s en [0.05, 2.30] m)
spider_mass_mg_min = 0.2
spider_mass_mg_max = 25.0
silk_length_m_min = 0.05
silk_length_m_max = 2.30

# Coeficiente de postura chi: 0.5 (compacta) a 1.0 (paracaídas extendido)
posture_chi_min = 0.5
posture_chi_max = 1.0

[carrying_capacity]
# Capacidad de carga base en hábitat promedio (K0) (Sección 8.4 de JORO-HPC.tex)
k0_min = 1000.0
k0_max = 20000.0
k0_default = 5000.0

# Coeficiente para impermeabilidad urbana Z_imp (gamma1)
gamma1_imp_min = 0.10
gamma1_imp_max = 1.00
gamma1_imp_default = 0.45

# Coeficiente para densidad de borde de bosque Z_borde (gamma2)
gamma2_borde_min = 0.20
gamma2_borde_max = 1.20
gamma2_borde_default = 0.65

# Coeficiente para dosel arbóreo Z_dosel (gamma3)
gamma3_dosel_min = 0.05
gamma3_dosel_max = 0.80
gamma3_dosel_default = 0.30

# Cotas de truncamiento [K_min, K_max]
k_min = 100.0
k_max = 50000.0
